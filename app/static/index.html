<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вращающаяся головоломка</title>
    <style>
        .shape-overlay {
            fill: rgba(22, 33, 62, 0.85);
            cursor: pointer;
            transition: fill 0.15s;
        }
        .shape-overlay:hover {
            fill: rgba(22, 33, 62, 0.95);
        }
        .shape-group {
            transition: transform 1.6s ease;
        }
        .circles-layer {
            /* Декоративный слой — не должен перехватывать клики,
               иначе клик прямо по кружку не сработает на треугольник. */
            pointer-events: none;
        }
        .value-text {
            font-size: 20px;
            font-weight: bold;
            fill: #ffffff;
            transition: opacity 0.25s ease;
        }
        .diagonal-overlay {
            /* Отдельная прямая поверх всего (НЕ часть самих рёбер треугольника) — основная
               часть, тянется от одной вершины через центральную точку до другой.
               По умолчанию невидима, появляется только когда сумма на этой диагонали верна. */
            fill: none;
            stroke: #fff6d9;
            stroke-width: 6;
            stroke-linecap: round;
            opacity: 0;
            filter: drop-shadow(0 0 6px rgba(255, 246, 217, 0.9));
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .diagonal-overlay-extension {
            /* То же самое, но тоньше и тусклее — это часть прямой, которая выходит ЗА пределы
               самой фигуры, тянется к надписи "текущее/цель". */
            fill: none;
            stroke: #fff6d9;
            stroke-width: 0.6;
            stroke-linecap: round;
            opacity: 0;
            filter: drop-shadow(0 0 2px rgba(255, 246, 217, 0.6));
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .diagonal-overlay-extension.diagonal-overlay-ok {
            opacity: 0.45;
        }
        .diagonal-overlay-ok {
            opacity: 1;
        }
        .ratio-text {
            font-size: 30px;
            font-weight: bold;
            fill: #ffffff;
            stroke: rgba(0, 0, 0, 0.55);
            stroke-width: 4;
            paint-order: stroke fill;
            opacity: 0.35;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }
        .sum-ok {
            opacity: 1;
            filter: drop-shadow(0 0 6px rgba(255, 246, 217, 0.9));
        }
        #texture-test {
            width: 853px;
            height: 480px;
            background-image: url("textures/Tiles_Roughness.jpg");
            background-repeat: repeat;
            background-size: 512px 512px;
            border: 2px solid #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Бабочка из двух треугольников</h1>
    <p>Клик по треугольнику — он физически поворачивается на 1 шаг.</p>

    <div id="texture-test">
        <svg width="853" height="480" viewBox="0 0 853 480">

            <defs>
                <!-- Градиент подсветки: прозрачный внутри (там всё равно закроет сам кружок),
                     яркий прямо на границе кружка (r=20 из 34 ≈ 59%), затем плавно гаснет наружу. -->
                <radialGradient id="circle-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff6d9" stop-opacity="0" />
                    <stop offset="58%" stop-color="#fff6d9" stop-opacity="0" />
                    <stop offset="65%" stop-color="#fff6d9" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#fff6d9" stop-opacity="0" />
                </radialGradient>
            </defs>

            <!-- СЛОЙ 1 (нижний): РЁБРА обеих фигур. Рисуются первыми, значит
                 лежат под всем, что нарисовано позже — в т.ч. под кружками
                 ДРУГОЙ фигуры в общей точке C. -->
            <g id="shape-left-edges" class="shape-group">
                <polygon class="shape-overlay" points="120,150 120,330 276,240"
                         onclick="rotateShape('left', 1)" />
                <line x1="120" y1="150" x2="120" y2="330" stroke="#16213e" stroke-width="8" />
                <line x1="120" y1="330" x2="276" y2="240" stroke="#16213e" stroke-width="8" />
                <line x1="276" y1="240" x2="120" y2="150" stroke="#16213e" stroke-width="8" />
            </g>

            <g id="shape-right-edges" class="shape-group">
                <polygon class="shape-overlay" points="432,150 432,330 276,240"
                         onclick="rotateShape('right', 1)" />
                <line x1="432" y1="150" x2="432" y2="330" stroke="#16213e" stroke-width="8" />
                <line x1="432" y1="330" x2="276" y2="240" stroke="#16213e" stroke-width="8" />
                <line x1="276" y1="240" x2="432" y2="150" stroke="#16213e" stroke-width="8" />
            </g>

            <!-- СЛОЙ 2 (верхний): КРУЖКИ + ПОДСВЕТКА обеих фигур. Рисуются
                 после слоя рёбер, значит лежат поверх ВСЕХ рёбер, включая
                 рёбра соседней фигуры. pointer-events:none — клики проходят
                 "сквозь" них к слою рёбер ниже. -->
            <g id="shape-left-circles" class="shape-group circles-layer">
                <circle cx="120" cy="150" r="34" fill="url(#circle-glow)" />
                <circle cx="120" cy="330" r="34" fill="url(#circle-glow)" />
                <circle cx="276" cy="240" r="34" fill="url(#circle-glow)" />
                <circle cx="120" cy="150" r="20" fill="#16213e" />
                <circle cx="120" cy="330" r="20" fill="#16213e" />
                <circle cx="276" cy="240" r="20" fill="#16213e" />
            </g>

            <g id="shape-right-circles" class="shape-group circles-layer">
                <circle cx="432" cy="150" r="34" fill="url(#circle-glow)" />
                <circle cx="432" cy="330" r="34" fill="url(#circle-glow)" />
                <circle cx="276" cy="240" r="34" fill="url(#circle-glow)" />
                <circle cx="432" cy="150" r="20" fill="#16213e" />
                <circle cx="432" cy="330" r="20" fill="#16213e" />
                <circle cx="276" cy="240" r="20" fill="#16213e" />
            </g>

            <!-- СЛОЙ 3: прямые-накладки поверх всего. Теперь каждая продолжена за одну из
                 своих крайних точек, чтобы дотянуться до места, где стоит надпись
                 "текущее/цель". Невидимы по умолчанию, появляются только когда сумма
                 совпадает с целью. Геометрически лежат там же, где и рёбра треугольников,
                 но это СВОЙ ОТДЕЛЬНЫЙ элемент, не часть вращающейся рамки — точки
                 A/B/C/D/E физически никогда не двигаются (меняется только число в них),
                 так что этим линиям не нужно никакого трансформа вообще. -->
            <!-- СЛОЙ 3А: основная часть диагонали (вершина-вершина-вершина) — толще. -->
            <polyline id="diagonal-overlay-diag1" class="diagonal-overlay" points="120,150 276,240 432,330" />
            <polyline id="diagonal-overlay-diag2" class="diagonal-overlay" points="432,150 276,240 120,330" />

            <!-- СЛОЙ 3Б: продолжение за крайнюю вершину до надписи — тоньше. -->
            <polyline id="diagonal-overlay-ext-diag1" class="diagonal-overlay-extension" points="432,330 510,375" />
            <polyline id="diagonal-overlay-ext-diag2" class="diagonal-overlay-extension" points="510,105 432,150" />

            <!-- Надписи "текущее/цель" на концах продолжений диагоналей. -->
            <text id="ratio-diag1" class="ratio-text sum-ok" x="510" y="375" text-anchor="middle" dominant-baseline="middle">9/9</text>
            <text id="ratio-diag2" class="ratio-text sum-ok" x="510" y="105" text-anchor="middle" dominant-baseline="middle">9/9</text>

            <!-- ЦИФРЫ: НЕЗАВИСИМЫ от рамок, всегда стоят на своих законных
                 местах и никогда не вращаются. По одной на каждую ТОЧКУ
                 (не на каждую фигуру) — значит, для общей C нужна только
                 ОДНА подпись, а не две дублирующих. -->
            <text id="text-A" class="value-text" x="120" y="150" text-anchor="middle" dominant-baseline="middle">1</text>
            <text id="text-B" class="value-text" x="432" y="150" text-anchor="middle" dominant-baseline="middle">2</text>
            <text id="text-C" class="value-text" x="276" y="240" text-anchor="middle" dominant-baseline="middle">3</text>
            <text id="text-D" class="value-text" x="120" y="330" text-anchor="middle" dominant-baseline="middle">4</text>
            <text id="text-E" class="value-text" x="432" y="330" text-anchor="middle" dominant-baseline="middle">5</text>

        </svg>
    </div>

    <script>
        let values = { A: 1, B: 2, C: 3, D: 4, E: 5 };

        // Глобальная блокировка: пока true — любые клики игнорируются.
        let isAnimating = false;

        // Длительность каждой фазы анимации (должны точно совпадать с CSS-transition):
        const FADE_DURATION_MS = 250;    // .value-text { transition: opacity 0.25s }
        const ROTATE_DURATION_MS = 1600; // .shape-group { transition: transform 1.6s }

        // Накопленный угол поворота каждой фигуры (растёт бесконечно, никогда
        // не сбрасывается — это убирает "отскок" рамки).
        let rotationState = { left: 0, right: 0 };

        // Абсолютные координаты каждой точки — используются, чтобы МАТЕМАТИЧЕСКИ
        // вычислить, куда попадает каждая вершина после поворота.
        const VERTEX_COORDS = {
            A: [120, 150],
            B: [432, 150],
            C: [276, 240],
            D: [120, 330],
            E: [432, 330],
        };

        const shapes = {
            left: ["A", "C", "D"],
            right: ["B", "E", "C"],
        };

        const lines = {
            diag1: { pointIds: ["A", "C", "E"], target: 9 },
            diag2: { pointIds: ["B", "C", "D"], target: 9 },
        };

        // Центроид каждой фигуры — точка, вокруг которой вращается рамка.
        const shapeCentroids = {
            left: [172, 240],
            right: [380, 240],
        };

        function rotationAroundPoint(px, py, angleDeg) {
            return `translate(${px}px, ${py}px) rotate(${angleDeg}deg) translate(${-px}px, ${-py}px)`;
        }

        // Каждая фигура физически состоит из ДВУХ SVG-групп (рёбра и кружки,
        // см. разметку выше — они разделены ради правильного порядка слоёв).
        // Обе должны поворачиваться совершенно одинаково и одновременно.
        function setShapeTransform(shapeId, transformStr) {
            document.getElementById("shape-" + shapeId + "-edges").style.transform = transformStr;
            document.getElementById("shape-" + shapeId + "-circles").style.transform = transformStr;
        }

        // Поворачивает точку (x,y) вокруг центра (cx,cy) на angleDeg — та же
        // математика, что использует CSS rotate().
        function rotatePoint(x, y, cx, cy, angleDeg) {
            const rad = (angleDeg * Math.PI) / 180;
            const dx = x - cx;
            const dy = y - cy;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
        }

        function rotateShape(shapeId, direction) {
            if (isAnimating) {
                return;
            }
            isAnimating = true;

            const pointIds = shapes[shapeId];

            // ПРЕЖДЕ любой анимации: вычисляем, какими будут значения ПОСЛЕ
            // поворота (не меняя настоящие values — это чистое предсказание).
            // Если какая-то диагональ сейчас горит, а после поворота перестанет совпадать
            // с целью — гасим её ПРЯМО СЕЙЧАС, до начала анимации поворота.
            const predictedValues = computeRotatedValues(shapeId, direction, values);

            for (const lineId in lines) {
                const line = lines[lineId];
                const currentSum = line.pointIds.reduce((total, id) => total + values[id], 0);
                const predictedSum = line.pointIds.reduce((total, id) => total + predictedValues[id], 0);

                const wasOk = currentSum === line.target;
                const willBeOk = predictedSum === line.target;

                if (wasOk && !willBeOk) {
                    document.getElementById("diagonal-overlay-" + lineId).classList.remove("diagonal-overlay-ok");
                    document.getElementById("diagonal-overlay-ext-" + lineId).classList.remove("diagonal-overlay-ok");
                    const ratioElement = document.getElementById("ratio-" + lineId);
                    ratioElement.classList.remove("sum-ok");
                }
            }

            // Этап 1: плавно гасим цифры этой фигуры (0.25с). Гасить плавно теперь
            // безопасно — текст больше не связан с вращающейся рамкой,
            // ему некуда "ехать" вместе с ней без компенсации.
            hideTextAnimated(pointIds);

            setTimeout(() => {
                // Этап 2: цифры уже полностью погасли — теперь запускаем плавный
                // физический поворот рамки (1.6с).
                rotationState[shapeId] += direction * 120;
                const angle = rotationState[shapeId];

                const [scx, scy] = shapeCentroids[shapeId];
                setShapeTransform(shapeId, rotationAroundPoint(scx, scy, angle));

                applyDataRotation(shapeId, direction);

                setTimeout(() => {
                    // Этап 3: рамка докрутилась — обновляем цифры (они всё ещё невидимы)
                    // и плавно проявляем их обратно (0.25с).
                    render();
                    showTextAnimated(pointIds);

                    setTimeout(() => {
                        isAnimating = false;
                    }, FADE_DURATION_MS);
                }, ROTATE_DURATION_MS);
            }, FADE_DURATION_MS);
        }

        function hideTextAnimated(pointIds) {
            pointIds.forEach(pointId => {
                document.getElementById("text-" + pointId).style.opacity = "0";
            });
        }

        function showTextAnimated(pointIds) {
            pointIds.forEach(pointId => {
                document.getElementById("text-" + pointId).style.opacity = "1";
            });
        }

        // Чистая функция: по заданному исходному состоянию чисел возвращает НОВОЕ состояние
        // после поворота заданной фигуры — НЕ трогая никаких глобальных переменных.
        // Используется и для предсказания (до анимации), и для реального применения.
        function computeRotatedValues(shapeId, direction, sourceValues) {
            const pointIds = shapes[shapeId];
            const [cx, cy] = shapeCentroids[shapeId];
            const angle = direction * 120;

            const updatedValues = Object.assign({}, sourceValues);
            const newAssignments = {};

            pointIds.forEach(sourceId => {
                const [ox, oy] = VERTEX_COORDS[sourceId];
                const [rx, ry] = rotatePoint(ox, oy, cx, cy, angle);

                let closestId = null;
                let closestDistance = Infinity;
                pointIds.forEach(candidateId => {
                    const [cx2, cy2] = VERTEX_COORDS[candidateId];
                    const distance = Math.hypot(rx - cx2, ry - cy2);
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        closestId = candidateId;
                    }
                });

                newAssignments[closestId] = sourceValues[sourceId];
            });

            Object.assign(updatedValues, newAssignments);
            return updatedValues;
        }

        function applyDataRotation(shapeId, direction) {
            values = computeRotatedValues(shapeId, direction, values);
        }

        function render() {
            for (const pointId in values) {
                document.getElementById("text-" + pointId).textContent = values[pointId];
            }

            for (const lineId in lines) {
                const line = lines[lineId];
                const sum = line.pointIds.reduce((total, id) => total + values[id], 0);

                const ratioElement = document.getElementById("ratio-" + lineId);
                const overlayElement = document.getElementById("diagonal-overlay-" + lineId);
                const overlayExtElement = document.getElementById("diagonal-overlay-ext-" + lineId);
                ratioElement.textContent = sum + "/" + line.target;

                if (sum === line.target) {
                    ratioElement.classList.add("sum-ok");
                    overlayElement.classList.add("diagonal-overlay-ok");
                    overlayExtElement.classList.add("diagonal-overlay-ok");
                } else {
                    ratioElement.classList.remove("sum-ok");
                    overlayElement.classList.remove("diagonal-overlay-ok");
                    overlayExtElement.classList.remove("diagonal-overlay-ok");
                }
            }
        }

        render();

        // Инициализируем начальный transform рамок в составной форме
        // (translate/rotate/translate) — чтобы первый клик анимировался
        // так же гладко, как и все последующие.
        Object.keys(shapeCentroids).forEach(shapeId => {
            const [cx, cy] = shapeCentroids[shapeId];
            setShapeTransform(shapeId, rotationAroundPoint(cx, cy, 0));
        });
    </script>

</body>
</html>
